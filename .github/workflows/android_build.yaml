name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Project with gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: ignore

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextplayer-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
