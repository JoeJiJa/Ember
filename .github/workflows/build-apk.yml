name: Build and Release EMBER APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build EMBER Web Distribution
        run: |
          cd web-player
          bun install
          bun run build

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK
        run: |
          mkdir -p release-artifacts
          find . -name "*.apk" -type f -exec cp {} release-artifacts/EMBER-Player-v1.0.0-debug.apk \;
          ls -la release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Player-v1.0.0-debug
          path: release-artifacts/*.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*.apk
          tag_name: v1.0.0
          name: "EMBER v1.0.0 - AMOLED Video Player"
          body: |
            ### 🌟 EMBER - Next-Gen AMOLED Video Player
            Rebuilt and modernized video player featuring:
            - **AMOLED Pitch-Black Design**: `#050505` with brushed metallic cards & warm gold `#F59E0B` accents.
            - **Gesture Control**: Swipe brightness, swipe volume/audio boost (up to 200%), double-tap seek ripples.
            - **Hold & Swipe Speed**: Long-press for 2X and swipe right up to 5X speed!
            - **Audio Studio**: 5-band Equalizer and Night Mode Dynamics Compressor.
            - **Dynamic Ambient Glow**: Real-time edge color backglow projection.
            - **Local File & Stream Support**: High performance native playback.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
