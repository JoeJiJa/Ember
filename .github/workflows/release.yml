name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execution permissions to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::Gradle build failed with status $STATUS"
            tail -n 200 build.log
            exit $STATUS
          fi

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ember-debug-apks-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_name }}
          name: Ember Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
